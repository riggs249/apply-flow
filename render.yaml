services:
  - type: web
    name: applyflow-backend
    runtime: docker
    # Monorepo: paths below are relative to rootDir (see Render monorepo docs).
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: STORAGE_TYPE
        value: supabase
      - key: DDL_AUTO
        value: update
      - key: SWAGGER_ENABLED
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: NOTIFICATION_LEAD_PROCESS_RATE_MS
        value: "300000"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_DAYS
        value: "30"
      - key: JWT_SECRET
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: resumes
      # Render free blocks SMTP 25/465/587 — send via Resend HTTPS API instead.
      - key: MAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
