spring:
  application:
    name: applyflow-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  upload-dir: ${UPLOAD_DIR:./uploads}
  notifications:
    # How often to check 24h / 1h / due emails for reminders, interviews, assessments
    lead-process-rate-ms: ${NOTIFICATION_LEAD_PROCESS_RATE_MS:${REMINDER_PROCESS_RATE_MS:60000}}
  reminders:
    process-rate-ms: ${REMINDER_PROCESS_RATE_MS:60000}
  mail:
    from: ${MAIL_FROM:HanapTracker <noreply@hanaptracker.local>}
  storage:
    type: ${STORAGE_TYPE:local}
    upload-dir: ${UPLOAD_DIR:./uploads}
    supabase:
      url: ${SUPABASE_URL:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:resumes}
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
    verification-token-hours: ${EMAIL_VERIFICATION_TOKEN_HOURS:24}
